<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>El Gran Mapa Pediátrico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Concepto: un atlas. El mapa general se lee como la edad del niño (el azul se oscurece del lactante al escolar);
   los submapas se leen como las preguntas de la familia, en columnas. */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --ink: #14202A;
  --muted: #5B6873;
  --line: #D3DAE0;
  --line-soft: #E3E8EC;
  --edad-1: #6E9FC0;
  --edad-2: #3A6F9C;
  --edad-3: #1C3F69;
  --accent: var(--edad-2);
  --c-inf: #B9502C; --c-ale: #7A4DA3; --c-infl: #1F7D74; --derm: #A85A2E; --cardio: #A33A4F; --neuro: #6A4C9C; --metab: #1D7A8C; --bloqueo: #C8203A; --mito: #1F7D74; --liso: #7A4DA3; --perox: #9A7414; --ret: #3F5FAE; --c-tox: #B8651B; --c-ener: #2C7DA0; --c-comp: #7A4DA3; --c-shunt: #C0533E; --c-cian: #3F5FAE; --c-obst: #9A7414; --c-vir: #2C7DA0; --c-bac: #B9502C; --c-ati: #7A4DA3; --c-otra: #6B7A85; --c-irab: #2E8A7A;
  --cuerpo: #E6ECF1; --cuerpo-borde: #C3CFD9; --organo: #D5DDE4; --organo-borde: #B7C3CD;
  --draft: #9A6514;
  --draft-bg: #F8EEDC;
  --ok: #2F7A55;
  --ok-bg: #E2F1E8;
  --danger: #A33A2C;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1519; --surface: #172028; --ink: #E2E8EC; --muted: #93A2AD;
    --line: #2B3843; --line-soft: #212C35;
    --edad-1: #5F93B6; --edad-2: #86B3DC; --edad-3: #C3D9F4;
    --draft: #E3B266; --draft-bg: #33281A; --ok: #7CC6A0; --ok-bg: #18301F; --danger: #F08C7C;
    --c-inf: #F0946F; --c-ale: #BC9DE3; --c-infl: #6CC6BC; --derm: #E7A076; --cardio: #EE8FA0; --neuro: #BDA8EA; --metab: #79C9D6; --bloqueo: #FF7A8A; --mito: #6CC6BC; --liso: #BC9DE3; --perox: #E0BC5A; --ret: #93ADF0; --c-tox: #F0A560; --c-ener: #7EC4E0; --c-comp: #BC9DE3; --c-shunt: #F2977F; --c-cian: #93ADF0; --c-obst: #E0BC5A; --c-vir: #7EC4E0; --c-bac: #F0946F; --c-ati: #BC9DE3; --c-otra: #A9B6BF; --c-irab: #6CC6B4;
    --cuerpo: #1D2932; --cuerpo-borde: #34444F; --organo: #2A3843; --organo-borde: #3E505C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1519; --surface: #172028; --ink: #E2E8EC; --muted: #93A2AD;
  --line: #2B3843; --line-soft: #212C35;
  --edad-1: #5F93B6; --edad-2: #86B3DC; --edad-3: #C3D9F4;
  --draft: #E3B266; --draft-bg: #33281A; --ok: #7CC6A0; --ok-bg: #18301F; --danger: #F08C7C;
  --c-inf: #F0946F; --c-ale: #BC9DE3; --c-infl: #6CC6BC; --derm: #E7A076; --cardio: #EE8FA0; --neuro: #BDA8EA; --metab: #79C9D6; --bloqueo: #FF7A8A; --mito: #6CC6BC; --liso: #BC9DE3; --perox: #E0BC5A; --ret: #93ADF0; --c-tox: #F0A560; --c-ener: #7EC4E0; --c-comp: #BC9DE3; --c-shunt: #F2977F; --c-cian: #93ADF0; --c-obst: #E0BC5A; --c-vir: #7EC4E0; --c-bac: #F0946F; --c-ati: #BC9DE3; --c-otra: #A9B6BF; --c-irab: #6CC6B4;
  --cuerpo: #1D2932; --cuerpo-borde: #34444F; --organo: #2A3843; --organo-borde: #3E505C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 28px; }

/* Encabezado */
header { display: grid; gap: 14px; }
.ruta { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ruta .sep { opacity: .5; }
.ruta b { color: var(--ink); font-weight: 600; }
.ruta button { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.bajada { margin: 0; color: var(--muted); max-width: 66ch; font-size: 16px; }
.barra { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.buscar { position: relative; flex: 1 1 260px; max-width: 380px; }
.buscar input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px 9px 34px;
}
.buscar svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.leyenda i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.leyenda .tema-i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--edad-2); }
.leyenda .con-i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip-estado { font-size: 12px; font-family: var(--f-mono); padding: 3px 8px; border-radius: 4px; white-space: nowrap; color: var(--draft); background: var(--draft-bg); }
.chip-estado.ok { color: var(--ok); background: var(--ok-bg); }
.chip-estado.neutro { color: var(--muted); background: var(--line-soft); }
.volver { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; justify-self: start; }
.volver:hover { border-color: var(--accent); color: var(--accent); }

/* Mapa */
.mapa { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; position: relative; }
.lienzo { overflow: auto; --z: 1; }
.lienzo.ampliado { max-height: 78vh; overscroll-behavior: contain; }
.mapa svg { display: block; width: calc(100% * var(--z)); min-width: calc(880px * var(--z)); height: auto; }
.zoom { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.zoom[hidden] { display: none; }
.zoom { flex-wrap: wrap; }
.zoom .ayuda-z { font-size: 12px; color: var(--muted); margin-left: auto; }
.filtro-est { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filtro-est[hidden] { display: none; }
.filtro-est .etq { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.filtro-est .pildora button { font-size: 12.5px; padding: 0 12px; }
.filtro-est .pildora button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.filtro-est .cuenta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
svg .nodo.articulo.atenuado { opacity: .13; }
svg .arista.rel.atenuada, svg.historia.enfoque .arista.rel.vecina.atenuada { opacity: .04; }
.zoom .pildora { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.zoom button { font: inherit; font-size: 15px; line-height: 1; min-width: 32px; height: 32px; border: 0; border-radius: 999px; background: none; color: var(--ink); cursor: pointer; }
.zoom button:hover { background: var(--line-soft); }
.zoom button:disabled { opacity: .35; cursor: default; background: none; }
.zoom button.txt { font-size: 12.5px; padding: 0 10px; }
.zoom span { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); min-width: 42px; text-align: center; }
.arista { fill: none; stroke: var(--line); stroke-width: 1.2; transition: stroke .2s, opacity .2s; }
.nodo { cursor: pointer; transition: opacity .2s; }
.nodo text { fill: var(--ink); font-family: var(--f-ui); }
.nodo .sub { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; }
.nodo .sub.acc { fill: var(--accent); }
.nodo.tema .halo { fill: var(--surface); stroke-width: 2; }
.nodo.tema .anillo { fill: none; stroke-width: 1; stroke-dasharray: 3 4; }
.nodo.tema text.t { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.nodo.concepto .punto { fill: var(--muted); transition: r .2s, fill .2s; }
.nodo.concepto .aro { fill: transparent; }
.nodo.concepto text.t { font-size: 13px; fill: var(--muted); }
svg.columnas .nodo.concepto .punto { fill: var(--accent); }
svg.con-causas .nodo.concepto .punto { fill: var(--muted); }
svg.columnas .nodo.concepto text.t { fill: var(--ink); font-size: 14px; }
.nodo:hover .punto, .nodo:focus-visible .punto, .nodo.activo .punto { fill: var(--accent); }
svg .nodo.concepto .punto.c-infecciosa, .leyenda .c-infecciosa { fill: var(--c-inf); background: var(--c-inf); }
svg .nodo.concepto .punto.c-alergica, .leyenda .c-alergica { fill: var(--c-ale); background: var(--c-ale); }
svg .nodo.concepto .punto.c-inflamatoria, .leyenda .c-inflamatoria { fill: var(--c-infl); background: var(--c-infl); }
svg .nodo.concepto .punto.c-cortocircuito, .leyenda .c-cortocircuito { fill: var(--c-shunt); background: var(--c-shunt); }
svg .nodo.concepto .punto.c-cianotica, .leyenda .c-cianotica { fill: var(--c-cian); background: var(--c-cian); }
svg .nodo.concepto .punto.c-obstructiva, .leyenda .c-obstructiva { fill: var(--c-obst); background: var(--c-obst); }
svg .nodo.concepto .punto.c-intoxicacion, .leyenda .c-intoxicacion { fill: var(--c-tox); background: var(--c-tox); }
svg .nodo.concepto .punto.c-energetico, .leyenda .c-energetico { fill: var(--c-ener); background: var(--c-ener); }
svg .nodo.concepto .punto.c-complejas, .leyenda .c-complejas { fill: var(--c-comp); background: var(--c-comp); }
svg .nodo.concepto .punto.c-viral, .leyenda .c-viral { fill: var(--c-vir); background: var(--c-vir); }
svg .nodo.concepto .punto.c-bacteriana, .leyenda .c-bacteriana { fill: var(--c-bac); background: var(--c-bac); }
svg .nodo.concepto .punto.c-atipica, .leyenda .c-atipica { fill: var(--c-ati); background: var(--c-ati); }
svg .nodo.concepto .punto.c-otra, .leyenda .c-otra { fill: var(--c-otra); background: var(--c-otra); }
.nodo .punto2.c-viral { fill: var(--c-vir); } .nodo .punto2.c-bacteriana { fill: var(--c-bac); } .nodo .punto2.c-atipica { fill: var(--c-ati); } .nodo .punto2.c-otra { fill: var(--c-otra); }
.p-causas .c-viral { background: var(--c-vir); } .p-causas .c-bacteriana { background: var(--c-bac); } .p-causas .c-atipica { background: var(--c-ati); } .p-causas .c-otra { background: var(--c-otra); }
.nodo .punto2 { stroke: var(--surface); stroke-width: 1.5; }
.nodo .punto2.c-infecciosa { fill: var(--c-inf); } .nodo .punto2.c-alergica { fill: var(--c-ale); } .nodo .punto2.c-inflamatoria { fill: var(--c-infl); }
.nodo .punto2.c-intoxicacion { fill: var(--c-tox); } .nodo .punto2.c-energetico { fill: var(--c-ener); } .nodo .punto2.c-complejas { fill: var(--c-comp); }
.nodo .punto2.c-cortocircuito { fill: var(--c-shunt); } .nodo .punto2.c-cianotica { fill: var(--c-cian); } .nodo .punto2.c-obstructiva { fill: var(--c-obst); }
#ley-causas { display: inline-flex; flex-wrap: wrap; gap: 6px 16px; }
.leyenda .causa-i { width: 9px; height: 9px; border-radius: 50%; }
.p-causas { display: inline-flex; gap: 6px; margin-left: 8px; }
.p-causas span { font-size: 11px; padding: 1px 7px; border-radius: 10px; color: #fff; }
.p-causas .c-infecciosa { background: var(--c-inf); } .p-causas .c-alergica { background: var(--c-ale); } .p-causas .c-inflamatoria { background: var(--c-infl); } .p-causas .c-cortocircuito { background: var(--c-shunt); } .p-causas .c-intoxicacion { background: var(--c-tox); } .p-causas .c-energetico { background: var(--c-ener); } .p-causas .c-complejas { background: var(--c-comp); } .p-causas .c-cianotica { background: var(--c-cian); } .p-causas .c-obstructiva { background: var(--c-obst); }
:root[data-theme="dark"] .p-causas span { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p-causas span { color: #111; } }
.nodo.concepto:hover text.t, .nodo.concepto.activo text.t { fill: var(--ink); }
.nodo:focus { outline: none; }
.nodo:focus-visible .aro, .nodo:focus-visible .halo { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 3; }
svg.enfoque .nodo:not(.vecino) { opacity: .22; }
svg.enfoque .arista { opacity: .25; }
svg.enfoque .arista.vecina { opacity: 1; stroke: var(--accent); stroke-width: 1.6; }
.eje line { stroke: var(--line); }
.eje text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.eje .titulo-eje { letter-spacing: .1em; text-transform: uppercase; font-size: 10px; }
.carril { stroke-linecap: round; stroke-width: 5; opacity: .85; }
.eje text.col-t { fill: var(--ink); font-family: var(--f-ui); font-size: 16px; font-weight: 600; }
.eje text.col-p { fill: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }
.col-div { stroke: var(--line-soft); stroke-dasharray: 2 5; }
.pista { font-size: 13px; color: var(--muted); margin: 0; padding: 10px 16px 14px; border-top: 1px solid var(--line-soft); }
.zona { fill: var(--bg); stroke: var(--line-soft); }
.eje text.zona-t { fill: var(--muted); font-family: var(--f-ui); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.eje text.zona-s { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.ruta-rec { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 6; opacity: .9; }
.num-rec circle { fill: var(--accent); }
.num-rec text { fill: var(--surface); font-family: var(--f-mono); font-size: 11px; font-weight: 500; }
svg.recorrido .arista { opacity: .15; }

/* Submapas y recorridos */
.submapas { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.submapas .btn { font-size: 13px; }
.submapas .sub-art { margin-left: 8px; }
.ref .links .btn-art { font: inherit; color: var(--accent); background: none; border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; cursor: pointer; }
.ref .links .btn-art:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.recorridos { display: grid; gap: 10px; }
.capas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.capas .etq { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
.capas .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.capa-btn { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.capa-btn b { font-family: var(--f-mono); font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid currentColor; font-weight: 500; }
.capa-btn .n { font-family: var(--f-mono); font-size: 11px; opacity: .75; }
.capa-btn:hover { color: var(--ink); }
.capa-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.capa-btn[aria-pressed="true"] b { border-color: transparent; background: var(--surface); color: var(--accent); }
.capas .ayuda { font-size: 12.5px; color: var(--muted); }
.mas-ocultos { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
svg.capa-1 .arista, svg.capa-2 .arista { stroke-width: 1.4; }
/* Historia: línea de tiempo de artículos */
.mapa svg.historia { min-width: calc(1180px * var(--z)); }
.hs-banda { fill: color-mix(in srgb, var(--hc) 7%, transparent); }
.hs-barra { fill: var(--hc); }
.eje text.hs-hilo { fill: var(--ink); font-family: var(--f-ui); font-size: 14px; font-weight: 600; }
.eje text.hs-hilo-s { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.eje text.hs-era { fill: var(--ink); font-family: var(--f-ui); font-size: 15px; font-weight: 600; }
.eje text.hs-era-p { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.eje .hs-div { stroke: var(--line); stroke-dasharray: 2 5; }
.eje text.hs-ley-t { fill: var(--muted); font-family: var(--f-ui); font-size: 12px; }
.eje text.hs-ley-h { fill: var(--ink); font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.nodo.articulo .aro { fill: transparent; }
.nodo.articulo .punto { fill: var(--hc); stroke: var(--surface); stroke-width: 2; transition: r .2s; }
.nodo.articulo .anillo-m { fill: none; stroke: var(--hc); stroke-width: 2; }
.nodo.articulo.superado .punto { fill: var(--surface); stroke: var(--hc); stroke-width: 2; stroke-dasharray: 3 2.5; }
.nodo.articulo text.t { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.nodo.articulo text.et { font-size: 10.5px; fill: var(--muted); }
.nodo.articulo.superado text.t { fill: var(--muted); }
.nodo.articulo:hover .punto, .nodo.articulo.activo .punto { fill: var(--hc); r: 9; }
.nodo.articulo.superado:hover .punto, .nodo.articulo.superado.activo .punto { fill: var(--surface); }
.arista.rel { stroke: var(--rc); stroke-width: 1.4; opacity: .5; }
.rel-supera { --rc: var(--bloqueo); } .rel-matiza { --rc: var(--c-tox); } .rel-confirma { --rc: var(--c-infl); } .rel-apoya { --rc: var(--muted); }
.arista.rel-matiza { stroke-dasharray: 7 4; } .arista.rel-apoya { stroke-dasharray: 2 3; }
.hs-punta { fill: var(--rc); }
svg.historia.enfoque .arista.rel { opacity: .1; }
svg.historia.enfoque .arista.rel.vecina { stroke: var(--rc); opacity: 1; stroke-width: 2.4; }
svg.historia.recorrido .arista.rel { opacity: .12; }
.p-original { margin: 0; font-size: 13.5px; color: var(--muted); font-style: italic; }

    el("text", { class: "ley-t", x: 18, y: 4 }, gb).textContent = "Enzima que falla (tocá para abrir la enfermedad)";
    // conteo de nombres para marcar los cruces entre vías
    const nombres = {};
    (m.grupos || []).forEach(g => g.carriles.forEach(c => c.pasos.forEach(p => { if (typeof p === "string" && p !== "|") { const k = normal(p.replace(/^[a-z]:/, "")); nombres[k] = (nombres[k] || 0) + 1; } })));
    const metEls = {};
    let y = 64;
    (m.grupos || []).forEach(grp => {
      const y0 = y;
      const banda = el("rect", { class: "via-banda", x: 8, y: y0, width: 1184, height: 10, rx: 14, style: "--g:" + grp.color }, svg);
      el("rect", { class: "via-barra", x: 8, y: y0, width: 5, height: 10, rx: 2, style: "--g:" + grp.color }, svg);
      el("text", { class: "via-grupo-t", x: 26, y: y0 + 24, style: "--g:" + grp.color }, svg).textContent = grp.titulo;
      y += 36;
      grp.carriles.forEach(car => {
        const cy = y + 40;
        el("text", { class: "via-carril-t", x: 26, y: cy - 2 }, svg).textContent = car.titulo;
        if (car.sub) {
          const lineas = [""];
          car.sub.split(" ").forEach(w => { const u = lineas.length - 1; if ((lineas[u] + " " + w).trim().length > 30 && lineas[u]) lineas.push(w); else lineas[u] = (lineas[u] + " " + w).trim(); });
          const t = el("text", { class: "via-carril-s", x: 26, y: cy + 15 }, svg);
          lineas.slice(0, 2).forEach((l, i) => { el("tspan", { x: 26, dy: i ? 14 : 0 }, t).textContent = l; });
        }
        // medir
        const items = car.pasos.map((p, i) => {
          if (p === "|") return { tipo: "corte", w: 40 };
          if (typeof p === "string") { const mm = p.match(/^([a-z]):(.*)$/); const t = mm ? mm[2] : p; return { tipo: "met", t, comp: mm ? COMP[mm[1]] : "", w: ancho(t) }; }
          return { tipo: "rx", p, w: p.ecm ? 96 : p.e ? 74 : 34 };
        });
        // insertar flechas simples entre metabolitos consecutivos
        const seq = [];
        items.forEach((it, i) => { if (it.tipo === "met" && seq.length && seq[seq.length - 1].tipo === "met") seq.push({ tipo: "rx", p: {}, w: 34 }); seq.push(it); });
        const base = seq.reduce((a, it) => a + it.w, 0);
        const nRx = seq.filter(it => it.tipo === "rx").length || 1;
        const extra = Math.max(0, Math.min(60, (X1 - X0 - base) / nRx));
        let x = X0;
        let prev = null;
        seq.forEach(it => {
          if (it.tipo === "corte") { x += it.w; prev = null; return; }
          if (it.tipo === "met") {
            const g = el("g", { class: "met " + it.comp, transform: `translate(${x},${cy})` }, svg);
            const k = normal(it.t);
            if (nombres[k] > 1) { g.classList.add("cruce"); g.addEventListener("mouseenter", () => (metEls[k] || []).forEach(e => e.classList.add("on"))); g.addEventListener("mouseleave", () => (metEls[k] || []).forEach(e => e.classList.remove("on"))); }
            el("rect", { x: 0, y: -13, width: it.w, height: 26, rx: 13 }, g);
            el("text", { x: it.w / 2, y: 4.5, "text-anchor": "middle" }, g).textContent = it.t;
            if (it.comp) el("title", {}, g).textContent = COMP_T[it.comp];
            (metEls[k] = metEls[k] || []).push(g);
            prev = x + it.w; x += it.w; return;
          }
          const L = it.w + extra, x1 = x + 4, x2 = x + L - 4, mx = x + L / 2;
          el("line", { class: "flecha", x1, y1: cy, x2, y2: cy, "marker-end": "url(#punta)" }, svg);
          const r = it.p;
          if (r.e) el("text", { class: "enz", x: mx, y: cy - 20, "text-anchor": "middle" }, svg).textContent = r.e;
          if (r.ecm) {
            const n = porId[r.ecm];
            const nom = r.dx || (n ? (n.corto || n.titulo) : r.ecm);
            const g = el("g", { class: "defecto", tabindex: 0, role: "button", "aria-label": (r.e ? r.e + ": " : "") + nom }, svg);
            el("line", { class: "bloq", x1: mx, y1: cy - 9, x2: mx, y2: cy + 9 }, g);
            const tw = nom.length * 6.6 + 16;
            el("rect", { class: "dx-bg", x: mx - tw / 2, y: cy + 15, width: tw, height: 20, rx: 10 }, g);
            el("text", { class: "dx", x: mx, y: cy + 29, "text-anchor": "middle" }, g).textContent = nom;
            el("title", {}, g).textContent = (n ? n.titulo : nom) + (r.nota ? " · " + r.nota : "");
            const ir = () => { pestana = pestana || "teoria"; abrir(r.ecm); };
            g.addEventListener("click", ir);
            g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(); } });
            (viaEls[r.ecm] = viaEls[r.ecm] || []).push(g);
          }
          x += L;
        });
        y += FILA;
      });
      y += 12;
      banda.setAttribute("height", y - y0 - 6);
      banda.nextSibling.setAttribute("height", y - y0 - 6);
      y += 8;
    });
    svg.setAttribute("viewBox", `0 0 1200 ${y + 4}`);
  }

  function pintarPasos() {
    const rec = recorridoActivo();
    const caja = $("pasos-rec");
    caja.hidden = !rec;
    if (!rec) { caja.innerHTML = ""; return; }
    caja.innerHTML = `<h2>${esc(rec.titulo)}</h2>${rec.descripcion ? `<p>${esc(rec.descripcion)}</p>` : ""}<ol>${rec.pasos.filter(p => porId[p.nodo]).map(p => `<li><button type="button" data-ir="${esc(p.nodo)}"><b>${esc(porId[p.nodo].titulo)}</b><span>${esc(p.nota)}</span></button></li>`).join("")}</ol>`;
  }
  function elegirRecorrido(id) {
    recorrido = id || null;
    pintarEncabezado(); pintarMapa();
  }

  function enfocar(id, conjunto) {
    const rec = recorridoActivo();
    if (esVias()) {
      const set = conjunto || (id ? new Set([id]) : null);
      svg.classList.toggle("enfoque", !!set);
      Object.entries(viaEls).forEach(([k, gs]) => gs.forEach(g => g.classList.toggle("activo", !!set && set.has(k))));
      return;
    }
    if (!id && !conjunto && rec) conjunto = new Set(rec.pasos.map(p => p.nodo));
    if (!id && !conjunto) {
      svg.classList.remove("enfoque");
      Object.values(nodoEls).forEach(g => g.classList.remove("vecino", "activo"));
      aristaEls.forEach(p => p.classList.remove("vecina"));
      return;
    }
    if (id && !nodoEls[id]) { enfocar(null); return; }
    const set = conjunto || new Set([id, ...(vecinos[id] || [])]);
    svg.classList.add("enfoque");
    Object.entries(nodoEls).forEach(([k, g]) => { g.classList.toggle("vecino", set.has(k)); g.classList.toggle("activo", k === id); });
    aristaEls.forEach(p => p.classList.toggle("vecina", !!id && (p.dataset.a === id || p.dataset.b === id)));
  }

  /* ───── Búsqueda (en el mapa visible) ───── */
  let busqueda = "", coincidencias = [];
  const textoNodo = n => normal([n.titulo, n.corto, n.resumen, ...(n.teoria || []).map(t => t.h + " " + String(t.html).replace(/<[^>]+>/g, " "))].join(" "));
  function aplicarBusqueda() {
    const t = normal(busqueda.trim());
    if ((MAPAS[mapaActual] || {}).disposicion === "cuerpo") { coincidencias = t ? N.filter(n => textoNodo(n).includes(t)).map(n => n.id) : []; pintarIndice(); return; }
    if (!t) { coincidencias = []; enfocar(actual); return; }
    const mapaN = (MAPAS[mapaActual] || {}).nodosDe || mapaActual;
    coincidencias = N.filter(n => n.mapa === mapaN && textoNodo(n).includes(t)).map(n => n.id);
    if (!esVias() && coincidencias.some(id => !nodoEls[id]) && capa() < 3) { capas[mapaActual] = 3; pintarEncabezado(); pintarMapa(); return; }
    enfocar(null, new Set(coincidencias.length ? coincidencias : ["__ninguno"]));
  }
  $("q").addEventListener("input", e => { busqueda = e.target.value; aplicarBusqueda(); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter" && coincidencias[0]) abrir(coincidencias[0]); });

  /* ───── Índice bajo el mapa ───── */
  const cuenta = n => `<span class="cuentas"><span><b>${(n.teoria || []).length}</b> secciones</span><span><b>${(n.diferenciales || []).length}</b> diferenciales</span><span><b>${(n.evidencia || []).length}</b> artículos</span><span><b>${(n.pico || []).length}</b> PICO</span><span><b>${(n.casos || []).length}</b> casos</span><span><b>${(n.ateneos || []).length}</b> ateneos</span></span>`;
  function pintarIndice() {
    const m = MAPAS[mapaActual] || MAPAS[INICIO];
    const visibles = N.filter(n => n.mapa === mapaActual);
    let html = "";
    if (m.disposicion === "cuerpo") {
      if (busqueda.trim()) {
        const res = coincidencias.slice(0, 40).map(id => porId[id]);
        html += `<h2>${res.length ? "Resultados en todo el mapa" : "Sin resultados"}</h2><div class="resultados">${res.map(n => `<button type="button" class="resultado" data-ir="${esc(n.id)}"><b>${esc(n.titulo)}</b><small>${esc((MAPAS[n.mapa] || {}).ruta ? MAPAS[n.mapa].ruta.slice(1).join(" › ") : "")}</small></button>`).join("")}</div>`;
      } else {
        html += `<h2>Sistemas</h2><div class="sistemas-idx">${(m.sistemas || []).map(sis => { const vivo = !!(sis.mapa && MAPAS[sis.mapa]); return `<button type="button" class="sistema" style="--sis:${esc(sis.color || "var(--accent)")}" ${vivo ? `data-mapa="${esc(sis.mapa)}"` : "disabled"}><b>${esc(sis.titulo)}</b><span>${esc(sis.detalle || "")}</span><em>${vivo ? conceptosDe(sis.mapa) + " conceptos →" : "Próximamente"}</em></button>`; }).join("")}</div>`;
      }
    } else if (m.disposicion === "vias") {
      html += `<h2>${esc(m.indice || "Enfermedades por vía")}</h2><div class="columnas-idx">${(m.grupos || []).map(g => { const ids = [...new Set(g.carriles.flatMap(c => c.pasos.filter(p => p && p.ecm && porId[p.ecm]).map(p => p.ecm)))]; return `<section><h3 style="color:${esc(g.color)}">${esc(g.titulo)}</h3><div class="chips">${ids.map(id => `<button type="button" class="chip" data-ir="${esc(id)}">${esc(porId[id].titulo)}</button>`).join("")}</div></section>`; }).join("")}</div>`;
    } else if (m.disposicion === "zonas") {
      const zs = m.zonas || [];
      const zonaDe = n => zs.findIndex(z => n.x >= z.x && n.x <= z.x + z.w && n.y >= z.y && n.y <= z.y + z.h);
      html += `<h2>${esc(m.indice || "Conceptos de la guía")}</h2><div class="columnas-idx">${zs.map((z, i) => `<section><h3>${esc(z.titulo)}</h3><div class="chips">${visibles.filter(n => zonaDe(n) === i).sort((a, b) => a.y - b.y || a.x - b.x).map(n => `<button type="button" class="chip" data-ir="${esc(n.id)}">${esc(n.titulo)}</button>`).join("")}</div></section>`).join("")}</div>`;
    } else if (m.disposicion === "historia") {
      html += `<h2>${esc(m.indice || "Artículos")}</h2><div class="columnas-idx">${(m.hilos || []).map(h => `<section><h3 style="color:${esc(h.color)}">${esc(h.titulo)}</h3><p>${esc(h.sub)}</p><div class="chips">${visibles.filter(n => n.hilo === h.id).sort((a, b) => (a.anio || 0) - (b.anio || 0)).map(n => `<button type="button" class="chip" data-ir="${esc(n.id)}">${esc(n.titulo)}</button>`).join("")}</div></section>`).join("")}</div>`;
    } else if (m.disposicion === "columnas") {
      const cols = m.columnas || [];
      const colDe = n => cols.reduce((best, c, i) => Math.abs(c.x - n.x) < Math.abs(cols[best].x - n.x) ? i : best, 0);
      html += `<h2>Conceptos del submapa</h2><div class="columnas-idx">${cols.map((c, i) => `<section><h3>${esc(c.titulo)}</h3><p>${esc(c.pregunta)}</p><div class="chips">${visibles.filter(n => colDe(n) === i).sort((a, b) => a.y - b.y).map(n => `<button type="button" class="chip" data-ir="${esc(n.id)}">${esc(n.titulo)}</button>`).join("")}</div></section>`).join("")}</div>`;
    } else {
      html += `<h2>Temas</h2><div class="temas">${visibles.filter(n => n.tipo === "tema").map(n => `
        <button type="button" class="tarjeta" data-ir="${esc(n.id)}">
          <span class="edad" style="color:${colorTema[n.id] || "var(--accent)"}">${esc((n.edad || "").toUpperCase())}</span>
          <h3>${esc(n.titulo)}</h3><p>${esc(n.resumen)}</p>${cuenta(n)}
        </button>`).join("")}</div>
        <h2>Conceptos</h2><div class="chips">${visibles.filter(n => n.tipo !== "tema").map(n => `<button type="button" class="chip" data-ir="${esc(n.id)}">${esc(n.titulo)}</button>`).join("")}</div>`;
    }
    const nPico = N.reduce((s, n) => s + (n.pico || []).length, 0);
    const nCasos = N.reduce((s, n) => s + (n.casos || []).length, 0);
    const nAt = N.reduce((s, n) => s + (n.ateneos || []).length, 0);
    const nRev = N.filter(n => n.revision && n.revision.estado === "revisado").length;
    html += `<p class="nota-pie">Todo el mapa: ${N.length} nodos · ${Object.keys(R).length} referencias · ${nPico} preguntas PICO · ${nCasos} casos · ${nAt} ateneos · ${nRev} nodos revisados. El contenido marcado como borrador fue redactado con asistencia de IA y necesita revisión médica antes de usarse en la práctica. Verificar dosis con el vademécum institucional.</p>`;
    $("indice").innerHTML = html;
  }

  /* ───── Panel: lectura ───── */
  const panel = $("panel"), velo = $("velo");
  const autorAnio = k => { const r = R[k]; if (!r) return k; const m = String(r.cita || "").match(/^([^,]+?)\s+[A-Z]{1,3}[,.]/); const a = String(r.cita || "").match(/(\d{4})[;.]/); return (m ? m[1] : (r.cita || k).split(/[.,]/)[0]) + (a ? " " + a[1] : ""); };
  const linkRef = r => {
    const out = [];
    if (r.pmid && /^\d+$/.test(String(r.pmid))) out.push(`<a href="https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/" target="_blank" rel="noopener">PubMed ${esc(r.pmid)}</a>`);
    if (r.doi && /^10\.\S+$/.test(String(r.doi))) out.push(`<a href="https://doi.org/${encodeURI(r.doi)}" target="_blank" rel="noopener">DOI</a>`);
    if (urlSegura(r.url)) out.push(`<a href="${esc(urlSegura(r.url))}" target="_blank" rel="noopener">Abrir</a>`);
    return out.join("");
  };
  const hrefRef = k => { const r = R[k]; if (!r) return ""; if (r.pmid && /^\d+$/.test(String(r.pmid))) return `https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/`; if (r.doi) return "https://doi.org/" + encodeURI(r.doi); return urlSegura(r.url); };
  const mapaDeRef = k => Object.keys(MAPAS).find(id => MAPAS[id].articulo === k) || null;
  const vacio = (t, d) => `<div class="vacio"><p>${t}</p>${d ? `<p>${d}</p>` : ""}</div>`;
  const invitacion = () => db && puedeEscribir !== false ? " Tocá <b>Editar</b> para agregar." : "";

  const lectura = {
    teoria: n => (n.teoria || []).length
      ? `<div class="lectura">${n.teoria.map(s => `<section><h3>${esc(s.h)}</h3><div class="rico">${limpiar(s.html)}</div></section>`).join("")}</div>`
      : vacio("Todavía no hay teoría para este concepto." + invitacion()),
    diferenciales: n => (n.diferenciales || []).length
      ? `<p class="dif-intro">Qué orienta a cada diagnóstico frente a <b>${esc(n.corto || n.titulo)}</b>:</p><div class="difs">${n.diferenciales.map(d => `<article class="dif"><h3><span>${esc(d.dx)}</span>${d.nodo && porId[d.nodo] && d.nodo !== n.id ? `<button type="button" class="btn-texto" data-ir="${esc(d.nodo)}">Abrir${porId[d.nodo].mapa !== n.mapa ? " ↗" : " →"}</button>` : ""}</h3><div class="rico">${limpiar(d.claves)}</div></article>`).join("")}</div>`
      : vacio("Todavía no hay diagnósticos diferenciales para este concepto." + invitacion(), "Por cada diferencial: el diagnóstico y los datos clave que orientan a pensarlo."),
    evidencia: n => (n.evidencia || []).filter(k => R[k]).length
      ? `<div class="refs">${n.evidencia.filter(k => R[k]).map(k => { const r = R[k]; return `<article class="ref"><span class="tipo">${esc(r.tipo)}</span><p class="hallazgo">${esc(r.hallazgo)}</p><p class="cita">${esc(r.cita)}</p><div class="links">${linkRef(r)}${mapaDeRef(k) && mapaDeRef(k) !== mapaActual ? `<button type="button" class="btn-art" data-mapa="${esc(mapaDeRef(k))}">Ver el mapa del artículo →</button>` : ""}</div></article>`; }).join("")}</div>`
      : vacio("Todavía no hay artículos asociados." + invitacion()),
    pico: n => (n.pico || []).length
      ? n.pico.map(p => `<article class="pico"><dl>
          <dt>P</dt><dd>${esc(p.p)}</dd><dt>I</dt><dd>${esc(p.i)}</dd><dt>C</dt><dd>${esc(p.c)}</dd><dt>O</dt><dd>${esc(p.o)}</dd></dl>
          <div class="resp"><p>${esc(p.respuesta)}</p><div class="pie">${p.certeza ? `<span class="certeza ${normal(p.certeza).split(" ")[0]}">Certeza ${esc(String(p.certeza).toLowerCase())}</span>` : ""}
          ${(p.refs || []).filter(k => R[k]).map(k => `<a href="${esc(hrefRef(k))}" target="_blank" rel="noopener">${esc(autorAnio(k))}</a>`).join("")}</div></div></article>`).join("")
      : vacio("Todavía no hay preguntas PICO." + invitacion(), "Cada pregunta lleva Paciente, Intervención, Comparación, Resultado, una respuesta breve, la certeza y sus referencias."),
    casos: n => (n.casos || []).length
      ? n.casos.map(c => `<article class="caso"><h3>${esc(c.titulo)}</h3><div class="rico">${limpiar(c.html)}</div>${(c.nodos || []).filter(id => porId[id]).length ? `<div class="chips">${c.nodos.filter(id => porId[id]).map(id => `<button type="button" class="chip" data-ir="${esc(id)}">${esc(porId[id].titulo)}</button>`).join("")}</div>` : ""}</article>`).join("")
      : vacio("Todavía no hay casos para este concepto." + invitacion(), "Casos ilustrativos, sin datos que permitan identificar a un paciente."),
    ateneos: n => (n.ateneos || []).length
      ? `<div class="refs">${n.ateneos.map(a => `<article class="ref"><span class="tipo">${esc([a.fecha, a.presenta].filter(Boolean).join(" · "))}</span><p class="hallazgo">${esc(a.titulo)}</p>${urlSegura(a.url) ? `<div class="links"><a href="${esc(urlSegura(a.url))}" target="_blank" rel="noopener">Abrir material</a></div>` : ""}</article>`).join("")}</div>${n.ateneos.some(a => urlSegura(a.url)) ? '<p class="aviso">Quien abra el enlace necesita permiso en el sitio donde está guardado el material.</p>' : ""}`
      : vacio("Todavía no hay ateneos ni clases cargados." + invitacion(), "Por cada uno: título, fecha, quién lo presentó y el enlace (Drive, YouTube privado, campus).")
  };

  function abrir(id, sinHash) {
    const n = porId[id]; if (!n) return;
    if (edicion && edicion.id !== id) { pedirDescartar(() => { edicion = null; abrir(id, sinHash); }); return; }
    if (n.mapa !== mapaActual && (MAPAS[mapaActual] || {}).nodosDe !== n.mapa) { mapaActual = n.mapa; busqueda = ""; $("q").value = ""; pintarTodo(); }
    actual = id;
    if (!nodoEls[id] && !esVias()) pintarMapa();
    if (!sinHash) history.replaceState(null, "", "#" + id);
    pintarPanel();
    panel.classList.add("abierto"); velo.classList.add("abierto"); panel.setAttribute("aria-hidden", "false");
    enfocar(id);
  }

  function pintarPanel() {
    const n = edicion ? edicion.n : porId[actual];
    if (!n) return;
    const enEdicion = !!edicion;
    const rev = n.revision || {};
    const puede = db && puedeEscribir !== false;
    $("p-cab").innerHTML = `
      <div class="p-fila">
        <span class="p-tipo">${n.tipo === "tema" ? "Tema" + (n.edad ? " · " + esc(n.edad) : "") : n.tipo === "articulo" ? "Artículo" + (n.anio ? " · " + esc(n.anio) : "") : "Concepto"}${n.mapa !== "raiz" && MAPAS[n.mapa] ? " · " + esc(MAPAS[n.mapa].titulo) : ""}${[].concat(n.causa || []).length ? `<span class="p-causas">${[].concat(n.causa).map(c => `<span class="c-${esc(c)}">${esc(CAUSAS[c] || c)}</span>`).join("")}</span>` : ""}</span>
        <span class="p-acciones">${!enEdicion && puede ? '<button type="button" class="btn" id="b-editar">Editar</button>' : ""}<button type="button" class="btn" id="b-cerrar">${enEdicion ? "Salir" : "Cerrar"}</button></span>
      </div>
      ${enEdicion
        ? `<label class="campo"><span>Título</span><input class="titulo-ed" id="ed-titulo" value="${esc(n.titulo)}"></label>
           <label class="campo"><span>Resumen en una línea</span><textarea id="ed-resumen" rows="2">${esc(n.resumen)}</textarea></label>`
        : `<h2 id="p-titulo">${esc(n.titulo)}</h2>${n.original ? `<p class="p-original">«${esc(n.original)}»</p>` : ""}<p class="p-resumen">${esc(n.resumen)}</p>`}
      <div class="p-meta" id="p-meta">
        ${n.tipo === "articulo" && ESTADOS[n.estado] ? `<span class="estado-art ${esc(n.estado)}">${ESTADOS[n.estado]}</span>` : ""}
        ${rev.estado === "revisado" ? `<span class="chip-estado ok">Revisado<span data-persona="${esc(rev.revisor || "")}" data-pre=" por "></span>${rev.fecha ? " · " + esc(fechaLinda(rev.fecha)) : ""}</span>` : `<span class="chip-estado">Borrador · sin revisar</span>`}
        ${n.fuente ? `<span>Fuente: ${esc(n.fuente)}</span>` : ""}
        ${n.editado && n.editado.fecha ? `<span>Última edición<span data-persona="${esc(n.editado.por || "")}" data-pre=": "></span> · ${esc(fechaLinda(n.editado.fecha))}</span>` : ""}
        ${!enEdicion && puede && uid ? (rev.estado === "revisado" ? '<button type="button" class="btn-texto" id="b-desrevisar">Volver a borrador</button>' : '<button type="button" class="btn-texto" id="b-revisar">Marcar como revisado</button>') : ""}
      </div>
      ${n.submapa && MAPAS[n.submapa] && !enEdicion ? `<button type="button" class="btn submapa-btn" data-mapa="${esc(n.submapa)}">Explorar el submapa: ${N.filter(x => x.mapa === n.submapa).length} conceptos →</button>` : ""}
      ${!enEdicion && !esVias() && viaDe(n.id) ? `<button type="button" class="btn submapa-btn" data-ver-mapa="${esc(viaDe(n.id))}">Ver dónde falla en las vías metabólicas →</button>` : ""}
      ${!enEdicion && esVias() && n.mapa !== mapaActual ? `<button type="button" class="btn submapa-btn" data-ver-mapa="${esc(n.mapa)}">Ver en el mapa clínico →</button>` : ""}
      <div class="pestanas" role="tablist">${PESTANAS.map(([k, t]) => `<button type="button" role="tab" aria-selected="${k === pestana}" data-tab="${k}">${t}<span class="n">${(n[k] || []).length}</span></button>`).join("")}</div>`;
    nombrarPersonas($("p-meta"));
    if (enEdicion) {
      $("ed-titulo").addEventListener("input", e => { edicion.n.titulo = e.target.value; marcarCambio(); });
      $("ed-resumen").addEventListener("input", e => { edicion.n.resumen = e.target.value; marcarCambio(); });
    }
    pintarCuerpo();

  function pintarCuerpo() {
    const n = edicion ? edicion.n : porId[actual];
    if (!n) return;
    $("p-cab").querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === pestana));
    if (edicion) { $("p-cuerpo").innerHTML = ""; editores[pestana]($("p-cuerpo"), n); return; }
    const con = [...(vecinos[n.id] || [])].map(id => porId[id]).filter(Boolean)
      .sort((a, b) => (a.mapa === b.mapa ? 0 : a.mapa === n.mapa ? -1 : 1));
    $("p-cuerpo").innerHTML = (pestana === "teoria" ? bloqueDialogo(n) : "") + lectura[pestana](n) +
      (con.length && n.tipo !== "articulo" ? `<div class="conexiones"><h4>Conectado con</h4><div class="chips">${con.map(c => `<button type="button" class="chip" data-ir="${esc(c.id)}">${esc(c.titulo)}${c.mapa !== n.mapa ? " ↗" : ""}</button>`).join("")}</div></div>` : "");
    $("p-cuerpo").scrollTop = 0;
  }

  async function nombrarPersonas(raiz) {
    if (!user) return;
    const spans = [...raiz.querySelectorAll("[data-persona]")].filter(s => s.dataset.persona);
    if (!spans.length) return;
    const ps = await user.profiles([...new Set(spans.map(s => s.dataset.persona))]);
    spans.forEach(s => { const p = ps[s.dataset.persona]; s.textContent = s.dataset.pre + ((p && p.name) || "alguien del equipo"); });
  }

  function cerrar() {
    if (edicion) { pedirDescartar(() => { edicion = null; cerrar(); }); return; }
    actual = null;
    panel.classList.remove("abierto"); velo.classList.remove("abierto"); panel.setAttribute("aria-hidden", "true");
    history.replaceState(null, "", mapaActual === INICIO ? location.pathname + location.search : "#mapa-" + mapaActual);
    enfocar(null);
  }

  /* ───── Panel: edición ───── */
  function empezarEdicion() {
    const n = porId[actual]; if (!n) return;
    const b = clon(n);
    ["teoria", "diferenciales", "evidencia", "pico", "casos", "ateneos", "conexiones"].forEach(k => { b[k] = b[k] || []; });
    edicion = { id: n.id, n: b, refs: {}, cambios: false, msg: "", error: false, guardando: false, confirmar: null };
    pintarPanel();
  }
  function marcarCambio() { if (!edicion.cambios) { edicion.cambios = true; pintarPie(); } }

  function pintarPie() {
    const pie = $("p-pie");
    if (!edicion) { pie.hidden = true; return; }
    pie.hidden = false;
    if (edicion.confirmar) {
      pie.innerHTML = `<span class="msg">Hay cambios sin guardar. ¿Descartarlos?</span><span class="p-acciones"><button type="button" class="btn" id="b-seguir">Seguir editando</button><button type="button" class="btn peligro" id="b-descartar">Descartar</button></span>`;
      $("b-seguir").onclick = () => { edicion.confirmar = null; pintarPie(); };
      $("b-descartar").onclick = () => { const f = edicion.confirmar; edicion = null; pintarPanel(); f && f(); };
      return;
    }
    pie.innerHTML = `<span class="msg${edicion.error ? " error" : ""}">${esc(edicion.msg || (edicion.cambios ? "Cambios sin guardar" : "Editando. Los cambios se ven para todo el equipo al guardar."))}</span>
      <span class="p-acciones"><button type="button" class="btn" id="b-cancelar">Cancelar</button><button type="button" class="btn prim" id="b-guardar" ${edicion.guardando ? "disabled" : ""}>${edicion.guardando ? "Guardando…" : "Guardar"}</button></span>`;
    $("b-cancelar").onclick = () => { if (edicion.cambios) pedirDescartar(() => {}); else { edicion = null; pintarPanel(); } };
    $("b-guardar").onclick = guardar;
  }
  function pedirDescartar(despues) {
    if (!edicion || !edicion.cambios) { edicion = null; pintarPanel(); despues(); return; }
    edicion.confirmar = despues; pintarPie();
  }

  // Campo de texto ligado a un objeto
  function campo(padre, etiqueta, obj, clave, opts = {}) {
    const l = document.createElement("label"); l.className = "campo";
    const s = document.createElement("span"); s.textContent = etiqueta; l.appendChild(s);
    let inp;
    if (opts.opciones) {
      inp = document.createElement("select");
      const ops = opts.opciones.includes(obj[clave]) || !obj[clave] ? opts.opciones : [obj[clave], ...opts.opciones];
      inp.innerHTML = `<option value="">—</option>` + ops.map(o => `<option${o === obj[clave] ? " selected" : ""}>${esc(o)}</option>`).join("");
    } else if (opts.largo) { inp = document.createElement("textarea"); inp.rows = opts.filas || 3; }
    else { inp = document.createElement("input"); if (opts.tipo) inp.type = opts.tipo; }
    if (!opts.opciones) inp.value = obj[clave] || "";
    if (opts.ph) inp.placeholder = opts.ph;
    inp.addEventListener("input", () => { obj[clave] = inp.value; marcarCambio(); if (opts.alCambiar) opts.alCambiar(); });
    inp.addEventListener("change", () => { obj[clave] = inp.value; marcarCambio(); });
    l.appendChild(inp); padre.appendChild(l);
    return inp;
  }
  // Texto con formato (negrita, listas) ligado a obj.html
  function editorRico(padre, obj, clave) {
    const herr = document.createElement("div"); herr.className = "herr";
    herr.innerHTML = '<button type="button" data-c="bold"><b>N</b></button><button type="button" data-c="italic"><i>C</i></button><button type="button" data-c="insertUnorderedList">• Lista</button><button type="button" data-c="insertOrderedList">1. Lista</button><button type="button" data-c="removeFormat">Quitar formato</button>';
    const ed = document.createElement("div"); ed.className = "editable"; ed.contentEditable = "true";
    ed.innerHTML = limpiar(obj[clave]);
    herr.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); document.execCommand(b.dataset.c); obj[clave] = ed.innerHTML; marcarCambio(); }));
    ed.addEventListener("input", () => { obj[clave] = ed.innerHTML; marcarCambio(); });
    ed.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
    padre.appendChild(herr); padre.appendChild(ed);
  }
  function bloque(padre, titulo, alBorrar, mover) {
    const b = document.createElement("div"); b.className = "ed-bloque";
    const f = document.createElement("div"); f.className = "ed-fila";
    const t = document.createElement("span"); t.className = "p-tipo"; t.textContent = titulo; f.appendChild(t);
    const acc = document.createElement("span"); acc.className = "p-acciones";
    if (mover) {
      [["↑", -1], ["↓", 1]].forEach(([s, d]) => { const x = document.createElement("button"); x.type = "button"; x.className = "btn-texto"; x.textContent = s; x.setAttribute("aria-label", d < 0 ? "Subir" : "Bajar"); x.onclick = () => mover(d); acc.appendChild(x); });
    }
    const del = document.createElement("button"); del.type = "button"; del.className = "btn-texto peligro"; del.textContent = "Quitar"; del.onclick = alBorrar; acc.appendChild(del);
    f.appendChild(acc); b.appendChild(f); padre.appendChild(b);
    return b;
  }
  function botonAgregar(padre, texto, fn) {
    const d = document.createElement("div"); d.className = "agregar";
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = texto; b.onclick = fn;
    d.appendChild(b); padre.appendChild(d); return d;

  const repintar = () => { const y = $("p-cuerpo").scrollTop; pintarCuerpo(); $("p-cab").querySelectorAll("[data-tab] .n").forEach((s, i) => { s.textContent = (edicion.n[PESTANAS[i][0]] || []).length; }); $("p-cuerpo").scrollTop = y; };
  const mover = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; marcarCambio(); repintar(); };
  const quitar = (arr, i) => { arr.splice(i, 1); marcarCambio(); repintar(); };
  const refEditable = k => { if (!edicion.refs[k]) edicion.refs[k] = clon(R[k] || { cita: "", tipo: "", hallazgo: "", pmid: "", doi: "", url: "" }); return edicion.refs[k]; };

  const editores = {
    teoria(c, n) {
      n.teoria.forEach((s, i) => {
        const b = bloque(c, "Sección " + (i + 1), () => quitar(n.teoria, i), d => mover(n.teoria, i, d));
        campo(b, "Título de la sección", s, "h");

      });
      botonAgregar(c, "+ Agregar sección", () => { n.teoria.push({ h: "", html: "" }); marcarCambio(); repintar(); });
    },
    diferenciales(c, n) {
      n.diferenciales.forEach((d, i) => {
        const b = bloque(c, "Diferencial " + (i + 1), () => quitar(n.diferenciales, i), d2 => mover(n.diferenciales, i, d2));
        campo(b, "Diagnóstico", d, "dx", { ph: "Bronquiolitis" });
        const otros = N.filter(x => x.id !== n.id).sort((a, b2) => a.titulo.localeCompare(b2.titulo));
        const l = document.createElement("label"); l.className = "campo"; l.innerHTML = "<span>Nodo del mapa (opcional)</span>";
        const sel = document.createElement("select");
        sel.innerHTML = `<option value="">Ninguno</option>` + otros.map(x => `<option value="${esc(x.id)}"${x.id === d.nodo ? " selected" : ""}>${esc(x.titulo)}</option>`).join("");
        sel.onchange = () => { d.nodo = sel.value || undefined; marcarCambio(); };
        l.appendChild(sel); b.appendChild(l);
        const t = document.createElement("p"); t.className = "aviso"; t.textContent = "Datos clave que orientan a este diagnóstico:"; b.appendChild(t);
        editorRico(b, d, "claves");
      });
      botonAgregar(c, "+ Agregar diferencial", () => { n.diferenciales.push({ dx: "", claves: "" }); marcarCambio(); repintar(); });
    },
    evidencia(c, n) {
      const p = document.createElement("p"); p.className = "aviso";
      p.textContent = "Los artículos son comunes a todo el mapa: si corregís uno, el cambio se ve en todos los nodos que lo citan.";
      c.appendChild(p);
      n.evidencia.forEach((k, i) => {
        const r = refEditable(k);
        const b = bloque(c, R[k] ? autorAnio(k) : "Artículo nuevo", () => quitar(n.evidencia, i), d => mover(n.evidencia, i, d));
        campo(b, "Hallazgo principal (una o dos frases)", r, "hallazgo", { largo: true });
        campo(b, "Tipo de estudio", r, "tipo", { ph: "Ensayo clínico aleatorizado (n = …)" });
        campo(b, "Cita", r, "cita", { largo: true, filas: 2 });
        const dos = document.createElement("div"); dos.className = "campos-2"; b.appendChild(dos);
        campo(dos, "PMID", r, "pmid", { ph: "12345678" });
        campo(dos, "DOI", r, "doi", { ph: "10.xxxx/…" });
        campo(b, "Otro enlace (opcional)", r, "url", { ph: "https://…" });
      });
      const ag = botonAgregar(c, "+ Artículo nuevo", () => { const k = "r" + Date.now().toString(36); refEditable(k); n.evidencia.push(k); marcarCambio(); repintar(); });
      const libres = Object.keys(R).filter(k => !n.evidencia.includes(k)).sort((a, b) => autorAnio(a).localeCompare(autorAnio(b)));
      if (libres.length) {
        const sel = document.createElement("select"); sel.setAttribute("aria-label", "Agregar un artículo que ya está en el mapa");
        sel.innerHTML = `<option value="">Agregar uno que ya está en el mapa…</option>` + libres.map(k => `<option value="${esc(k)}">${esc(autorAnio(k))} · ${esc(String(R[k].tipo || "").slice(0, 40))}</option>`).join("");
        sel.onchange = () => { if (sel.value) { n.evidencia.push(sel.value); marcarCambio(); repintar(); } };
        ag.appendChild(sel);
      }
    },
    pico(c, n) {
      n.pico.forEach((q, i) => {
        const b = bloque(c, "Pregunta " + (i + 1), () => quitar(n.pico, i), d => mover(n.pico, i, d));
        campo(b, "P · Paciente", q, "p", { largo: true, filas: 2 });
        campo(b, "I · Intervención (o exposición)", q, "i", { largo: true, filas: 2 });
        campo(b, "C · Comparación", q, "c", { largo: true, filas: 2 });
        campo(b, "O · Resultado", q, "o", { largo: true, filas: 2 });
        campo(b, "Respuesta breve", q, "respuesta", { largo: true, filas: 4 });
        campo(b, "Certeza de la evidencia", q, "certeza", { opciones: CERTEZAS });
        q.refs = q.refs || [];
        const ks = n.evidencia.filter(k => R[k] || edicion.refs[k]);
        const l = document.createElement("div"); l.className = "campo";
        l.innerHTML = `<span>Referencias que la responden</span>`;
        const ch = document.createElement("div"); ch.className = "checks";
        if (!ks.length) ch.textContent = "Primero agregá artículos en la pestaña Evidencia.";
        ks.forEach(k => {
          const lab = document.createElement("label");
          const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = q.refs.includes(k);
          cb.onchange = () => { q.refs = cb.checked ? [...q.refs, k] : q.refs.filter(x => x !== k); marcarCambio(); };
          lab.appendChild(cb); lab.appendChild(document.createTextNode(R[k] ? autorAnio(k) : "Artículo nuevo"));
          ch.appendChild(lab);
        });
        l.appendChild(ch); b.appendChild(l);
      });
      botonAgregar(c, "+ Agregar pregunta PICO", () => { n.pico.push({ p: "", i: "", c: "", o: "", respuesta: "", certeza: "", refs: [] }); marcarCambio(); repintar(); });
    },
    casos(c, n) {
      const p = document.createElement("p"); p.className = "aviso";
      p.textContent = "Casos ilustrativos: sin nombres, iniciales, número de historia clínica ni fechas de nacimiento.";
      c.appendChild(p);
      n.casos.forEach((cs, i) => {
        const b = bloque(c, "Caso " + (i + 1), () => quitar(n.casos, i), d => mover(n.casos, i, d));
        campo(b, "Título", cs, "titulo", { ph: "18 meses, cuarto episodio" });
        editorRico(b, cs, "html");
      });
      botonAgregar(c, "+ Agregar caso", () => { n.casos.push({ titulo: "", html: "", nodos: [] }); marcarCambio(); repintar(); });
    },
    ateneos(c, n) {
      n.ateneos.forEach((a, i) => {
        const b = bloque(c, "Ateneo " + (i + 1), () => quitar(n.ateneos, i), d => mover(n.ateneos, i, d));
        campo(b, "Título", a, "titulo");
        const dos = document.createElement("div"); dos.className = "campos-2"; b.appendChild(dos);
        campo(dos, "Fecha", a, "fecha", { ph: "Noviembre 2026" });
        campo(dos, "Quién lo presentó", a, "presenta");
        campo(b, "Enlace", a, "url", { ph: "https://drive.google.com/…" });
      });
      botonAgregar(c, "+ Agregar ateneo o clase", () => { n.ateneos.push({ titulo: "", fecha: "", presenta: "", url: "" }); marcarCambio(); repintar(); });
    }
  };

  async function guardar() {
    if (!edicion || edicion.guardando) return;
    const e = edicion, n = e.n;
    if (!String(n.titulo || "").trim()) { e.msg = "El título no puede quedar vacío."; e.error = true; pintarPie(); return; }
    n.teoria = n.teoria.filter(s => String(s.h || "").trim() || String(s.html || "").replace(/<[^>]+>/g, "").trim()).map(s => ({ h: String(s.h || "").trim(), html: limpiar(s.html) }));
    n.casos = n.casos.filter(c => String(c.titulo || "").trim() || String(c.html || "").replace(/<[^>]+>/g, "").trim()).map(c => Object.assign({}, c, { html: limpiar(c.html) }));
    n.ateneos = n.ateneos.filter(a => String(a.titulo || "").trim() || String(a.url || "").trim());
    n.diferenciales = (n.diferenciales || []).filter(d => String(d.dx || "").trim()).map(d => { const o = { dx: String(d.dx).trim(), claves: limpiar(d.claves) }; if (d.nodo) o.nodo = d.nodo; return o; });
    n.pico = n.pico.filter(q => ["p", "i", "c", "o", "respuesta"].some(k => String(q[k] || "").trim()));
    // Artículos nuevos o corregidos
    const refsAGuardar = Object.entries(e.refs).filter(([k, r]) => n.evidencia.includes(k) && JSON.stringify(r) !== JSON.stringify(R[k] || null) && (String(r.cita || "").trim() || String(r.pmid || "").trim() || String(r.hallazgo || "").trim()));
    n.evidencia = n.evidencia.filter(k => R[k] || refsAGuardar.some(([x]) => x === k));
    const previo = porId[n.id];
    const doc = clon(n); delete doc.id;
    if (previo && previo.revision && previo.revision.estado === "revisado") {
      doc.revision = { estado: "borrador", revisor: null, fecha: null, ultimaRevision: { revisor: previo.revision.revisor || null, fecha: previo.revision.fecha || null } };
    }
    doc.editado = { por: uid, fecha: new Date().toISOString() };
    e.guardando = true; e.msg = "Guardando…"; e.error = false; pintarPie();
    try {
      for (const [k, r] of refsAGuardar) await db.collection("refs").doc(k).set(clon(r));
      await db.collection("nodos").doc(n.id).set(doc);
      dbN[n.id] = doc; refsAGuardar.forEach(([k, r]) => { dbR[k] = r; });
      edicion = null; recomponer(); pintarTodo(); pintarPanel();
    } catch (err) {
      e.guardando = false; e.error = true;
      if (err && err.code === "invalid_argument") { e.msg = "No se pudo guardar: tu acceso a este mapa es de solo lectura, o el contenido es demasiado grande."; }
      else if (err && err.code === "quota_exceeded") { e.msg = "No se pudo guardar: el mapa llegó al límite de espacio."; }
      else { e.msg = "No se pudo guardar. Revisá la conexión y probá de nuevo."; }
      pintarPie();
    }
  }

  async function marcarRevision(revisado) {
    const n = porId[actual]; if (!n || !db) return;
    const doc = clon(n); delete doc.id;
    doc.revision = revisado ? { estado: "revisado", revisor: uid, fecha: hoy() } : { estado: "borrador", revisor: null, fecha: null, ultimaRevision: n.revision ? { revisor: n.revision.revisor || null, fecha: n.revision.fecha || null } : null };
    try { await db.collection("nodos").doc(n.id).set(doc); dbN[n.id] = doc; recomponer(); pintarTodo(); pintarPanel(); }
    catch (err) { const m = $("p-meta"); const s = document.createElement("span"); s.style.color = "var(--danger)"; s.textContent = "No se pudo guardar la revisión."; m.appendChild(s); }
  }

  /* ───── Navegación ───── */
  function irAMapa(id) {
    if (!MAPAS[id]) id = INICIO;
    const seguir = () => {
      actual = null; mapaActual = id; busqueda = ""; $("q").value = ""; recorrido = null;
      panel.classList.remove("abierto"); velo.classList.remove("abierto"); panel.setAttribute("aria-hidden", "true");
      history.replaceState(null, "", id === INICIO ? location.pathname + location.search : "#mapa-" + id);
      pintarTodo(); window.scrollTo({ top: 0 });
    };
    if (edicion) pedirDescartar(seguir); else seguir();
  }
  function desdeHash() {
    const h = location.hash.slice(1);
    if (h.startsWith("mapa-")) { irAMapa(h.slice(5)); return; }
    if (porId[h]) { abrir(h, true); return; }
  }
  function pintarTodo() { pintarEncabezado(); pintarMapa(); pintarIndice(); pintarEstadoDatos(); }

  document.addEventListener("click", e => {
    const t = e.target;
    const mapaBtn = t.closest("[data-mapa]"); if (mapaBtn) { irAMapa(mapaBtn.dataset.mapa); return; }
    const verBtn = t.closest("[data-ver-mapa]"); if (verBtn && !edicion) { mapaActual = verBtn.dataset.verMapa; recorrido = null; busqueda = ""; $("q").value = ""; pintarTodo(); pintarPanel(); enfocar(actual); const g = (viaEls[actual] || [])[0] || nodoEls[actual]; if (g && g.scrollIntoView) g.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    const capaBtn = t.closest("[data-capa]"); if (capaBtn) { capas[mapaActual] = +capaBtn.dataset.capa; pintarEncabezado(); pintarMapa(); return; }
    const recBtn = t.closest("[data-rec]"); if (recBtn) { elegirRecorrido(recBtn.dataset.rec === recorrido ? null : recBtn.dataset.rec); return; }
    const ir = t.closest("[data-ir]"); if (ir) { if (!edicion) pestana = pestana || "teoria"; abrir(ir.dataset.ir); return; }
    const tab = t.closest("[data-tab]"); if (tab) { pestana = tab.dataset.tab; pintarCuerpo(); return; }
    if (t.closest("#b-cerrar")) { cerrar(); return; }
    if (t.closest("#b-editar")) { empezarEdicion(); return; }
    if (t.closest("#b-revisar")) { marcarRevision(true); return; }
    if (t.closest("#b-desrevisar")) { marcarRevision(false); return; }
    const a = t.closest('#p-cuerpo a[href^="#"]');
    if (a && !edicion && porId[a.getAttribute("href").slice(1)]) { e.preventDefault(); pestana = "teoria"; abrir(a.getAttribute("href").slice(1)); }
  });
  $("volver").addEventListener("click", () => irAMapa((MAPAS[mapaActual] || {}).padre || INICIO));
  velo.addEventListener("click", cerrar);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && actual && !edicion && !(e.target.closest && e.target.closest("#tutor"))) cerrar(); });
  window.addEventListener("hashchange", desdeHash);
  window.addEventListener("beforeunload", e => { if (edicion && edicion.cambios) { e.preventDefault(); e.returnValue = ""; } });


  /* ───── Arranque ───── */
  recomponer();
  pintarTodo();
  desdeHash();

  (async function conectar() {
    const c = window.claude;
    if (!c || !c.use) { conectado = "sin"; pintarEstadoDatos(); return; }
    const [d, u] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
    user = u;
    if (!d) { conectado = "sin"; pintarEstadoDatos(); return; }
    db = d;
    if (user) {
      uid = await user.id();
      puedeEscribir = await user.can("data.write");
    }
    pintarEstadoDatos();
    if (actual && !edicion) pintarPanel();
    const aviso = setTimeout(() => { const e = $("estado-datos"); e.className = "chip-estado"; e.textContent = "Sin conexión con la base · puede estar desactualizado"; }, 10000);
    let listos = 0;
    const alLlegar = (snap, destino) => {
      if (!snap.metadata.fromCache && ++listos >= 2) { clearTimeout(aviso); pintarEstadoDatos(); }
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      if (destino === "n") dbN = o; else dbR = o;
      recomponer(); pintarEncabezado(); pintarMapa(); pintarIndice();
      if (actual && !edicion) pintarPanel();
    };
    const alFallar = () => { clearTimeout(aviso); const e = $("estado-datos"); e.className = "chip-estado"; e.textContent = "Sin conexión con la base · versión base"; };
    db.collection("nodos").onSnapshot(s => alLlegar(s, "n"), alFallar);
    db.collection("refs").onSnapshot(s => alLlegar(s, "r"), alFallar);
  })();
})();
